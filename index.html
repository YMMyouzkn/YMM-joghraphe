    (Object.values(j.query.pages)[0].langlinks||[]).forEach(x=>GL[x.lang]=x['*']);try{localStorage.setItem('ymm_gl',JSON.stringify(GL))}catch(e){}ui()}catch(e){}}
function ui(){const h=document.documentElement;h.lang=LG;h.dir=RTL.test(LG)?'rtl':'ltr';
  {const nm='YMM '+(GW[LG]||GL[LG]||'Geography');document.title=nm;$('h1').textContent=nm}
  $('q').placeholder=tr('ph');$('top').textContent=tr('cnt')('');
  if($('lg').value!==LG)fill([...$('lg').options].map(o=>[o.value,o.textContent]));
  setT(h.dataset.theme);tabs();stats();banner()}
$('lg').onchange=e=>{LG=e.target.value;try{localStorage.setItem('lg',LG)}catch(x){}location.hash='';ui();render()};
$('q').addEventListener('input',()=>{if(location.hash)location.hash='';if(view!=='q'){view='q';tabs()}render()});
addEventListener('hashchange',route);
ui();render();route();clock();setInterval(clock,1000);
addEventListener('load',()=>setTimeout(()=>{langs();gw()},2500));
</script>
